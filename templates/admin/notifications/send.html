{% extends 'base.html' %}

{% block title %}Send Notifications{% endblock %}

{% block extra_css %}
<style>
    .rtl { direction: rtl; }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4 rtl">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h4 class="fw-bold">إرسال إشعار</h4>
        <span class="badge text-bg-light border">Admin</span>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <form id="sendNotificationForm" class="row g-3" onsubmit="return false;">
                    <div class="col-12">
                        <label class="form-label">المستلم</label>
                        <select class="form-select" name="recipient_id" id="recipient_id">
                            <option value="none" selected>صاحب الورقة فقط (لنحتاج لاحقاً – هنا سنستخدم API بالـrecipient_id الذي تختاره)</option>
                            <option value="-1">[تجريبي] جميع المستخدمين (لن يستخدم في هذا السيناريو)</option>
                        </select>
                        <div class="form-text">في هذا الطلب سنركز على صاحب الورقة فقط.</div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">User ID (optional)</label>
                        <input type="number" class="form-control" name="manual_recipient_id" id="manual_recipient_id" placeholder="مثال: 12">
                    </div>

                    <div class="col-12">
                        <label class="form-label">نوع الإشعار</label>
                        <select class="form-select" name="notification_type" id="notification_type">
                            <option value="system" selected>system</option>
                            <option value="like">like</option>
                            <option value="comment">comment</option>
                            <option value="review">review</option>
                            <option value="follow">follow</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">العنوان</label>
                        <input type="text" class="form-control" name="title" id="title" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">الرسالة</label>
                        <textarea class="form-control" name="message" id="message" rows="4" required></textarea>
                    </div>

                    <div class="col-12 d-grid">
                        <button type="button" class="btn btn-primary" onclick="sendNotification()">
                            <i class="fa-solid fa-bell me-2"></i>إرسال
                        </button>
                    </div>
                </form>

                <div id="resultBox" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
async function sendNotification() {
    const box = document.getElementById('resultBox');
    box.innerHTML = '';

    const title = document.getElementById('title').value.trim();
    const message = document.getElementById('message').value.trim();
    const notification_type = document.getElementById('notification_type').value;
    const manual_recipient_id = document.getElementById('manual_recipient_id').value.trim();

    const payload = {
        recipient_id: null,
        title,
        message,
        notification_type
    };

    if (manual_recipient_id !== '') {
        payload.recipient_id = parseInt(manual_recipient_id, 10);
    }

    try {
        const resp = await fetch('/api/v1/admin/send-notification/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload),
            credentials: 'include'
        });

        const data = await resp.json().catch(() => ({}));

        if (!resp.ok) {
            box.innerHTML = `<div class="alert alert-danger">${data.error || 'Failed'}</div>`;
            return;
        }

        box.innerHTML = `<div class="alert alert-success">${data.message || 'Sent'}</div>`;
    } catch (e) {
        box.innerHTML = `<div class="alert alert-danger">Network error</div>`;
    }
}
</script>
{% endblock %}
